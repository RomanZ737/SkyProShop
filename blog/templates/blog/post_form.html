<!-- home.html -->
{% extends "catalog/base.html" %}

{% block title %}Новый пост{% endblock %}

{% block content %}
<div class="container align-content-center">
<div class="col-6">
  <form method="post" enctype="multipart/form-data">
    <div class="card">
      <div class="card-body">
        {% csrf_token %}
        {{ form.as_p}}
      </div>
      <button type="submit" class="btn btn-primary m-lg-1" href="{% url 'blog:post_create' %}" role="button">
        {% if object %}
          Сохранить
        {% else %}
          Создать
        {% endif %}
      </button>
    </div>
  </form>
  <a class="btn btn-secondary m-lg-1" href="{% url 'blog:post_list' %}" role="button">Вернуться
  </a>
</div>
</div>
{% endblock %}
