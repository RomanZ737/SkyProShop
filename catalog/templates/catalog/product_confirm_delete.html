<!-- home.html -->
{% extends "catalog/base.html" %}

{% block title %}Удалить пост {{ object.title }}{% endblock %}

{% block content %}

<div class="container">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p class="fs-1 text-start">
      Вы действительно хотите удалить {{ object.name }}?!
    </p>
    <button type="submit" href='{% url "catalog:product_delete" object.pk %}' class="btn btn-danger m-lg-2">Удалить</button>
    <a role="button" href='{% url "catalog:product_detail" object.pk %}' class="btn btn-secondary m-lg-2" >Закрыть</a>
  </form>
</div>
{% endblock %}
