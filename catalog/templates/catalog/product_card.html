
<div class="col-3">

    <a href="{% url 'catalog:product_detail' product.pk %}" class="text-decoration-none">

      <div class="card mb-4 box-shadow">
          <div class="card-header">
               <h4 class="my-0 font-weight-normal">{{product.name}}</h4>
          </div>
          <div class="card-body">
              <h1 class="card-title pricing-card-title">{{product.price}} р.</h1>
                   <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                      <li>- {{product.category.name}}</li>
                     <li>- {{product.description|truncatechars:100}}</li>
                      <li>- Доставлен: {{product.created_at|date:"d.m.Y"}}</li>
                       <li>{% if product.is_published %}
                                - Продукт опубликован
                           {% else %}
                                - Продукт НЕ опубликован
                           {% endif %}
                       </li>
                  </ul>
                  <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
          </div>
      </div>
    </a>
</div>
