<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">SkyProShop</h5>
    <nav class="ms-5 d-flex flex-nowrap align-items-center gap-2">
    <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
    {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="/product/create/">+ Добавить товар</a>
    {% endif %}
    <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
    <a class="p-2 btn btn-outline-primary" href="/post_list/">Блог</a>
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
        </form>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:user_update' %}">Редактировать Профиль</a>
    {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
</div>
